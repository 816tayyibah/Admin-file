<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#1a472a"/>
<title>Deen & Fun Camp — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a472a 0%, #2d6a4f 50%, #1b4332 100%); min-height: 100vh; padding: 16px; }
  .header { text-align: center; padding: 16px 0 12px; }
  .header-icon { font-size: 36px; margin-bottom: 6px; }
  .header h1 { color: #ffd700; font-size: 20px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,.4); }
  .header p  { color: #a8d8a8; font-size: 12px; margin-top: 4px; }
  .status-bar { text-align: center; font-size: 11px; color: #a8d8a8; margin-bottom: 8px; }
  .status-bar.err { color: #ff6b6b; }
  .nav-tabs { display: flex; gap: 4px; margin-bottom: 14px; background: rgba(0,0,0,.2); border-radius: 12px; padding: 4px; flex-wrap: wrap; }
  .nav-tab { flex: 1; min-width: 60px; padding: 9px 4px; border: none; background: transparent; color: #a8d8a8; font-size: 11px; font-weight: 500; border-radius: 8px; cursor: pointer; text-align: center; white-space: nowrap; }
  .nav-tab.active { background: #ffd700; color: #1a472a; font-weight: 700; }
  .section { display: none; }
  .section.active { display: block; }
  .card { background: rgba(255,255,255,.95); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .card-title { font-size: 14px; font-weight: 700; color: #1a472a; margin-bottom: 12px; }
  .summary-strip { display: flex; gap: 6px; margin-bottom: 12px; }
  .summary-box { flex: 1; background: rgba(255,255,255,.15); border-radius: 10px; padding: 8px 4px; text-align: center; }
  .summary-box .num { font-size: 20px; font-weight: 700; color: #ffd700; }
  .summary-box .num.red { color: #ff6b6b; }
  .summary-box .lbl { font-size: 10px; color: #a8d8a8; margin-top: 3px; line-height: 1.3; }
  .today-date { background: #ffd700; color: #1a472a; font-weight: 700; font-size: 13px; padding: 6px 10px; border-radius: 20px; text-align: center; margin-bottom: 12px; }
  .alpha-index { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .alpha-btn { padding: 4px 8px; background: rgba(45,106,79,.12); border: 1px solid #c8e6c9; border-radius: 6px; font-size: 12px; font-weight: 700; color: #2d6a4f; cursor: pointer; }
  .alpha-btn:hover { background: #2d6a4f; color: white; }
  .alpha-header { font-size: 12px; font-weight: 700; color: #2d6a4f; background: #e8f5e9; padding: 4px 10px; border-radius: 6px; margin: 8px 0 4px; letter-spacing: 1px; }
  .student-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
  .student-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #f8fdf8; border: 1.5px solid #c8e6c9; border-radius: 14px; }
  .student-card.marked-present { background: #d4edda; border-color: #52b788; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #2d6a4f, #52b788); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .s-name { font-size: 16px; font-weight: 700; color: #1a472a; }
  .s-info { font-size: 11px; color: #444; margin-top: 2px; }
  .btn-mark { padding: 8px 14px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-present { background: #52b788; color: white; }
  .btn-absent  { background: #e9ecef; color: #555; }
  .btn-del { padding: 5px 9px; background: #fee2e2; color: #c0392b; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; }
  .btn-edit { padding: 5px 9px; background: #e3f2fd; color: #1565c0; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; margin-right: 4px; }
  .add-form { display: flex; flex-direction: column; gap: 8px; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; padding: 10px 12px; border: 2px solid #2d6a4f; border-radius: 10px; font-size: 14px; outline: none; }
  .add-row input:focus { border-color: #ffd700; }
  .age-input { width: 80px !important; flex: none !important; }
  .btn-add { padding: 10px 14px; background: #2d6a4f; color: white; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .bulk-area { width: 100%; padding: 10px 12px; border: 2px solid #2d6a4f; border-radius: 10px; font-size: 13px; outline: none; resize: vertical; min-height: 80px; font-family: inherit; }
  .bulk-area:focus { border-color: #ffd700; }
  .absent-list { background: #fff5f5; border: 1.5px solid #ffcdd2; border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .absent-list-title { font-size: 12px; font-weight: 700; color: #c0392b; margin-bottom: 6px; }
